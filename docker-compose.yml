services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER:-opa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opa}
      POSTGRES_DB: ${DB_NAME:-opa}
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - opa_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
    depends_on:
      - postgres

volumes:
  opa_postgres_data:
