<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vehicle identity labeler</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; display: flex; flex-direction: column;
         height: 100vh; background: #ffffff; color: #111827; }
  header { padding: 8px 16px; background: #111827; color: #f3f4f6; display: flex; gap: 20px; align-items: center;
           font-size: 13px; flex-wrap: wrap; }
  header b { color: #fff; }
  #main { flex: 1; min-height: 0; display: flex; }
  #map { flex: 1; min-width: 0; }
  #side { width: 320px; flex: none; border-left: 1px solid #d1d5db; overflow-y: auto; background: #f9fafb; }
  .tally { padding: 8px 12px; background: #eef2ff; border-bottom: 1px solid #d1d5db; font-size: 12px; }
  .tally .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .cand { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; font-size: 12px; cursor: pointer; }
  .cand:hover { background: #f3f4f6; }
  .cand.selected { background: #dbeafe; }
  .cand-head { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cand-stats { color: #4b5563; margin-top: 2px; }
  .cand-stats span { display: inline-block; margin-right: 10px; }
  .prior-tag { display: inline-block; background: #fde68a; color: #92400e; border-radius: 4px; padding: 0 5px;
               font-size: 10px; font-weight: 700; margin-left: 4px; }
  #panel { padding: 10px 16px; border-top: 1px solid #d1d5db; background: #fff; display: flex;
           gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid #9ca3af; cursor: pointer;
           background: #f9fafb; color: #111827; }
  button.primary { border-color: #2563eb; background: #2563eb; color: #fff; }
  button.warn { border-color: #d97706; }
  button:hover { filter: brightness(0.95); }
  kbd { background: #e5e7eb; border-radius: 3px; padding: 0 5px; font-size: 12px; }
  #win-info { color: #9ca3af; }
</style>
</head>
<body>
<header>
  <span>Bus: <b id="bus-number">-</b></span>
  <span>Line: <b id="line-number">-</b></span>
  <span>Trip: <b id="trip-window">-</b></span>
  <span>Duration: <b id="trip-duration">-</b></span>
  <span>Feed: <b id="feed">-</b></span>
  <span id="win-info"></span>
</header>
<div id="main">
  <div id="map"></div>
  <div id="side">
    <div class="tally" id="tally"></div>
    <div id="candidates"></div>
  </div>
</div>
<div id="panel">
  <button class="primary" id="submit-btn">Submit selection</button>
  <button id="none-btn">None match (skip)</button>
  <button class="warn" id="next-bus-btn">Next bus &rarr;</button>
  <span>Click a candidate to toggle it, or use <kbd>1</kbd>-<kbd>9</kbd>, then <kbd>Enter</kbd> to submit,
    <kbd>N</kbd> for none, <kbd>B</kbd> for next bus.</span>
</div>

<script>
const IDA_COLOR = "#2563eb";
const VOLTA_COLOR = "#ea580c";
const CAND_COLORS = ["#16a34a", "#dc2626", "#9333ea", "#0891b2", "#ca8a04",
                      "#db2777", "#65a30d", "#4f46e5", "#0d9488", "#c2410c"];

let map = null;
let layers = [];
let current = null;
let selected = new Set();

function fmt(v, digits = 1) {
  if (v === null || v === undefined) return "-";
  return Number(v).toFixed(digits);
}

function clearMap() {
  layers.forEach((l) => map.removeLayer(l));
  layers = [];
}

function drawShape(shapeId, color, label) {
  const path = current.shapes[shapeId];
  if (!path || !path.length) return [];
  const latlngs = path.map((p) => [p.lat, p.lon]);
  const line = L.polyline(latlngs, { color, weight: 6, opacity: 0.55 }).addTo(map);
  layers.push(line);
  const start = L.circleMarker(latlngs[0], { radius: 8, color: "#065f46", weight: 2,
    fillColor: "#16a34a", fillOpacity: 1 })
    .bindTooltip(label + " START", { permanent: false }).addTo(map);
  const end = L.circleMarker(latlngs[latlngs.length - 1], { radius: 8, color: "#7f1d1d", weight: 2,
    fillColor: "#dc2626", fillOpacity: 1 })
    .bindTooltip(label + " END", { permanent: false }).addTo(map);
  layers.push(start, end);
  return latlngs;
}

function drawCandidate(cand, color, idx) {
  const latlngs = cand.pings.map((p) => [p.lat, p.lon]);
  let prev = null;
  latlngs.forEach((ll) => {
    if (prev) layers.push(L.polyline([prev, ll], { color, weight: 3, opacity: 0.9 }).addTo(map));
    prev = ll;
  });
  latlngs.forEach((ll, i) => {
    const marker = L.circleMarker(ll, { radius: i === 0 || i === latlngs.length - 1 ? 6 : 3.5,
      color: "#111", weight: 0.7, fillColor: color, fillOpacity: 1 })
      .bindTooltip(`#${idx + 1} vehicle_id ${cand.candidate_vehicle_id}`, { permanent: false });
    marker.addTo(map);
    layers.push(marker);
  });
  return latlngs;
}

function renderMap() {
  clearMap();
  let bounds = [];
  bounds = bounds.concat(drawShape(shapeIdFor("-I"), IDA_COLOR, "IDA"));
  bounds = bounds.concat(drawShape(shapeIdFor("-V"), VOLTA_COLOR, "VOLTA"));
  current.candidates.forEach((cand, i) => {
    const color = CAND_COLORS[i % CAND_COLORS.length];
    bounds = bounds.concat(drawCandidate(cand, color, i));
  });
  requestAnimationFrame(() => {
    map.invalidateSize();
    if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
    else map.setView([-3.73, -38.53], 12);
  });
}

function shapeIdFor(suffix) {
  return Object.keys(current.shapes).find((sid) => sid.endsWith(suffix));
}

function renderTally(tally) {
  const el = document.getElementById("tally");
  if (!tally.candidates.length) {
    el.innerHTML = `<div>${tally.n_trips_labeled} trip(s) reviewed for this bus so far. No candidate selected yet.</div>`;
    return;
  }
  const rows = tally.candidates.map((c) =>
    `<div class="row"><span>vehicle_id ${c.candidate_vehicle_id} (${c.candidate_device_id || "?"})</span>
     <span>${c.n_selected}/${tally.n_trips_labeled}</span></div>`
  ).join("");
  el.innerHTML = `<div><b>${tally.n_trips_labeled}</b> trip(s) reviewed for this bus:</div>${rows}`;
}

function renderCandidates() {
  const el = document.getElementById("candidates");
  el.innerHTML = "";
  current.candidates.forEach((cand, i) => {
    const color = CAND_COLORS[i % CAND_COLORS.length];
    const div = document.createElement("div");
    div.className = "cand" + (selected.has(i) ? " selected" : "");
    const priorTag = cand.prior_evidence_trips > 0
      ? `<span class="prior-tag">prior evidence x${cand.prior_evidence_trips}</span>` : "";
    const dirStats = cand.best_direction === "V" ? cand.volta : cand.ida;
    div.innerHTML = `
      <div class="cand-head"><span class="swatch" style="background:${color}"></span>
        #${i + 1} vehicle_id ${cand.candidate_vehicle_id}${priorTag}</div>
      <div class="cand-stats">
        <span>device: ${cand.candidate_device_id || "?"}</span>
        <span>pings: ${cand.n_pings_in_window}</span>
        <span>dist: ${fmt(cand.best_avg_dist_to_line_m)}m</span>
        <span>dir: ${cand.best_direction || "?"}</span>
        <span>corr: ${fmt(dirStats ? dirStats.progress_corr : null, 2)}</span>
      </div>`;
    div.onclick = () => toggle(i);
    el.appendChild(div);
  });
}

function toggle(i) {
  if (selected.has(i)) selected.delete(i); else selected.add(i);
  renderCandidates();
}

function render(data) {
  current = data;
  selected = new Set();
  document.getElementById("bus-number").textContent = data.vehicle_number;
  document.getElementById("line-number").textContent = data.line_number;
  document.getElementById("trip-window").textContent =
    new Date(data.trip_opened_at).toLocaleString() + " → " + new Date(data.trip_closed_at).toLocaleTimeString();
  const durMin = (new Date(data.trip_closed_at) - new Date(data.trip_opened_at)) / 60000;
  document.getElementById("trip-duration").textContent = durMin.toFixed(0) + " min";
  document.getElementById("feed").textContent = data.resolved_feed_version_date;
  document.getElementById("win-info").textContent = `${data.candidates.length} candidate(s) shown`;
  renderTally(data.bus_tally);
  renderCandidates();
  renderMap();
}

async function loadNext(advanceBus) {
  const res = await fetch(`/api/next?advance_bus=${advanceBus ? "true" : "false"}`);
  if (!res.ok) {
    document.getElementById("candidates").innerHTML = "<div style='padding:12px'>Nothing left to review.</div>";
    return;
  }
  render(await res.json());
}

async function submit(noneMatch) {
  if (!current) return;
  const candidates = current.candidates.map((c, i) => ({
    candidate_vehicle_id: c.candidate_vehicle_id,
    candidate_device_id: c.candidate_device_id,
    n_pings_in_window: c.n_pings_in_window,
    best_avg_dist_to_line_m: c.best_avg_dist_to_line_m,
    best_direction: c.best_direction,
    selected: noneMatch ? false : selected.has(i),
  }));
  await fetch("/api/label", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      vehicle_number: current.vehicle_number,
      line_number: current.line_number,
      trip_opened_at: current.trip_opened_at,
      trip_closed_at: current.trip_closed_at,
      candidates,
    }),
  });
  loadNext(false);
}

document.getElementById("submit-btn").onclick = () => submit(false);
document.getElementById("none-btn").onclick = () => submit(true);
document.getElementById("next-bus-btn").onclick = () => loadNext(true);

document.addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "9") toggle(Number(e.key) - 1);
  else if (e.key === "Enter") submit(false);
  else if (e.key.toLowerCase() === "n") submit(true);
  else if (e.key.toLowerCase() === "b") loadNext(true);
});

map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, opacity: 0.55, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);
map.setView([-3.73, -38.53], 12);

loadNext(false);
</script>
</body>
</html>
