repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: python
        types: [python]
        pass_filenames: true
        # ml/bus_matching_model/app and ml/trip_validity_model/app both
        # have same-named sibling modules (features.py, db.py, ...). A
        # single shared pyproject.toml `environment.extra-paths` list
        # makes bare `from features import X` ambiguous between the two
        # -- confirmed live, ty silently resolves it to whichever tree is
        # listed first, breaking the other tree's own sibling imports.
        # Excluded here rather than added to that shared list; matches
        # the standing call to leave this app's lint/format debt for
        # later too. `scripts/` is excluded for the same reason -- it
        # imports those same sibling modules by bare name.
        # tools/trip_viewer/app is excluded for the same bare-sibling-import
        # reason (its own `db`/`maps`), not added to extra-paths -- it's a
        # throwaway exploration tool, same standing call as the two above.
        exclude: ^(ml/bus_matching_model/(app|scripts)|tools/trip_viewer/app)/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.22
    hooks:
      - id: uv-export
        name: uv export dependencies
        args: [--no-dev, --output-file, requirements.txt]
      - id: uv-export
        name: uv export dev dependencies
        args: [--only-group, dev, --output-file, requirements-dev.txt]
      - id: uv-lock
