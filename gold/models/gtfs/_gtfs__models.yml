version: 2

models:
  - name: dim_shape
    description: >
      One row per (feed_version_date, shape_id): GTFS shape points
      aggregated into a single LineString, ordered by shape_pt_sequence.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: shape_id
        tests:
          - not_null
      - name: geom
        tests:
          - not_null

  - name: dim_gtfs_feed_version
    description: >
      One row per GTFS feed export, with the real-world calendar date
      range (valid_from, valid_to) it was actually in effect for.
      valid_to is null for the latest export, meaning still current.
    columns:
      - name: feed_version_date
        tests:
          - not_null
          - unique
      - name: valid_from
        tests:
          - not_null

  - name: dim_gtfs_service_date
    description: >
      One row per (feed_version_date, service_id, calendar_date) the
      service actually operated on: gtfs_calendar's weekly pattern
      expanded into real dates, corrected by gtfs_calendar_dates'
      exceptions.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: service_id
        tests:
          - not_null
      - name: calendar_date
        tests:
          - not_null

  - name: dim_gtfs_agency
    description: One row per transit agency, per feed export.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: agency_name
        tests:
          - not_null

  - name: dim_gtfs_route
    description: >
      One row per route, per feed export. agency_id references
      dim_gtfs_agency within the same feed_version_date.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: route_id
        tests:
          - not_null
      - name: route_type
        tests:
          - not_null

  - name: dim_gtfs_trip
    description: >
      One row per scheduled trip, per feed export. Not to be confused
      with dim_afc_trip (a real observed vehicle run, not a GTFS
      schedule definition). route_id references dim_gtfs_route,
      shape_id references dim_shape, both within the same
      feed_version_date.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
      - name: route_id
        tests:
          - not_null
      - name: service_id
        tests:
          - not_null

  - name: dim_gtfs_stop
    description: >
      One row per stop/station, per feed export. parent_station
      self-references stop_id within the same feed_version_date.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: stop_id
        tests:
          - not_null
      - name: stop_name
        tests:
          - not_null
      - name: geom
        tests:
          - not_null

  - name: dim_gtfs_stop_time
    description: >
      One row per (feed_version_date, trip_id, stop_sequence). trip_id
      references dim_gtfs_trip, stop_id references dim_gtfs_stop, both
      within the same feed_version_date.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
      - name: stop_id
        tests:
          - not_null
      - name: stop_sequence
        tests:
          - not_null

  - name: dim_gtfs_fare
    description: One row per fare, per feed export.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: fare_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: dim_gtfs_fare_rule
    description: >
      One row per fare/route/zone rule, per feed export. A bridge table
      by design, no simple natural key. fare_id references dim_gtfs_fare,
      route_id (nullable) references dim_gtfs_route, both within the
      same feed_version_date.
    columns:
      - name: feed_version_date
        tests:
          - not_null
      - name: fare_id
        tests:
          - not_null
