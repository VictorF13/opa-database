version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: gtfs_shapes
        description: >
          GTFS shape points, one row per (feed_version_date, shape_id,
          shape_pt_sequence). See silver/gtfs.py in the Python pipeline.
        columns:
          - name: feed_version_date
            description: Date of the GTFS feed export this row belongs to.
          - name: shape_id
            description: GTFS shape identifier.
          - name: shape_pt_sequence
            description: Order of this point within its shape.
      - name: gtfs_calendar
        description: >
          Weekly service patterns (day-of-week flags plus a validity date
          range) per service_id, per feed_version_date. See
          silver/gtfs.py.
      - name: gtfs_calendar_dates
        description: >
          Exceptions to gtfs_calendar's weekly pattern for specific
          dates: exception_type 1 adds service on a date the weekly
          pattern wouldn't otherwise include, 2 removes it on a date the
          pattern would otherwise include. A few raw exports are missing
          this file entirely; for those, copied_from_feed_version_date is
          non-null and records which other export's data was substituted.
          See silver/gtfs.py.
      - name: gtfs_agency
        description: Transit agencies operating the feed. See silver/gtfs.py.
      - name: gtfs_routes
        description: Routes. References agency_id. See silver/gtfs.py.
      - name: gtfs_trips
        description: >
          Scheduled trips. References route_id, service_id, shape_id.
          See silver/gtfs.py.
      - name: gtfs_stops
        description: >
          Stop/station locations. parent_station self-references
          stop_id for stops that belong to a larger station. See
          silver/gtfs.py.
      - name: gtfs_stop_times
        description: >
          Per-trip, per-stop scheduled arrival/departure. References
          trip_id, stop_id. One raw export is missing this file entirely;
          for that one, copied_from_feed_version_date is non-null and
          records which other export's data was substituted. See
          silver/gtfs.py.
      - name: gtfs_fare_attributes
        description: Fare prices and transfer rules. See silver/gtfs.py.
      - name: gtfs_fare_rules
        description: >
          Maps fares to routes/zones. References fare_id, optionally
          route_id. See silver/gtfs.py.
