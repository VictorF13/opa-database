version: 2

models:
  # int_vehicle_dictionary is not listed here: it is an ephemeral model
  # (see its own file for why), has exactly one consumer
  # (dim_vehicle_master), and is never materialized as its own object, so
  # there's nothing in the database to test directly. Its logic is
  # exercised indirectly through dim_vehicle_master's tests below.

  - name: dim_vehicle_master
    description: >
      Conformed vehicle identity across AFC and GPS. One row per distinct
      physical vehicle ever seen in either source. master_vehicle_id is
      the GPS id_veiculo when a confirmed dictionary match exists,
      otherwise a synthesized, source-prefixed id so every vehicle still
      gets one. match_status tags provenance: matched, afc_only, or
      avl_only. Deliberately not testing uniqueness of afc_vehicle_number
      or gps_vehicle_id directly: both are nullable (populated only when
      that source has this vehicle), and dbt's unique test treats
      multiple nulls as a single duplicated group, which would be a false
      positive here. master_vehicle_id is the true, always-populated key.
    columns:
      - name: master_vehicle_id
        tests:
          - not_null
          - unique
      - name: match_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["matched", "afc_only", "avl_only"]

  - name: fact_avl_ping
    description: >
      All of silver.avl_pings plus master_vehicle_id, resolving each
      ping's vehicle to the conformed identity in dim_vehicle_master.
    columns:
      - name: master_vehicle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vehicle_master')
                field: master_vehicle_id
      - name: metric_timestamp
        tests:
          - not_null
