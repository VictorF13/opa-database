version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: afc_boardings
        description: >
          Flattened AFC/bilhetagem boarding events, one row per Passageiro
          in the raw feed. Heavily denormalized on purpose: every row
          repeats its trip/line/vehicle/company columns (measured ~16.4x
          redundancy). See silver/afc.py in the Python pipeline.
        columns:
          - name: event_id
            description: >
              Transaction identifier. Not a reliable unique key: "0" is a
              sentinel for records with no real transaction reference and
              legitimately repeats.
